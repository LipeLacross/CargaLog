name: Backend CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cargalog-backend
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # 1. SLSA/Supply chain security
      - name: Generate provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/cargalog-backend
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      # 2. Scanner de vulnerabilidades
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cargalog-backend:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # 3. Build e Push (mantido do original)
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true  # Atesta a origem da imagem


  deploy-by-webhook:
    name: Deploy (optional webhook)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL != '' }}

    steps:
      - name: Trigger deployment webhook
        run: |
          curl -X POST "${{ secrets.BACKEND_DEPLOY_WEBHOOK_URL }}"

  deploy-to-prod:
    name: Deploy to Production (SSH)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.SERVER_HOST != '' }}
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Pull da nova imagem
            docker pull ghcr.io/${{ github.repository_owner }}/cargalog-backend:latest
            
            # Stop e remove container antigo
            docker stop backend || true
            docker rm backend || true
            
            # Inicia novo container
            docker run -d --name backend -p 3000:3000 \
              --env-file /root/.env.cargalog \
              ghcr.io/${{ github.repository_owner }}/cargalog-backend:latest
            
            # Cleanup: Remove imagens Docker antigas (mantém as 3 mais recentes)
            docker image prune -f
            docker images --format '{{.Repository}}:{{.Tag}}' | grep cargalog-backend | tail -n +4 | xargs -r docker rmi || true
            
            # Remove containers e imagens não utilizadas
            docker system prune -f --volumes || true