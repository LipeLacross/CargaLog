<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fundo gradiente com arredondamento -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background com gradient -->
  <rect width="200" height="200" rx="40" fill="url(#bgGradient)" />

  <!-- Haltere (Dumbbell) -->
  <!-- Peso esquerdo -->
  <rect x="35" y="75" width="25" height="50" rx="3" fill="url(#metalGradient)" />

  <!-- Barra central -->
  <rect x="65" y="85" width="70" height="30" rx="5" fill="#000000" opacity="0.8" />

  <!-- Destaque na barra -->
  <rect x="65" y="85" width="70" height="8" rx="5" fill="#ffffff" opacity="0.3" />

  <!-- Peso direito -->
  <rect x="140" y="75" width="25" height="50" rx="3" fill="url(#metalGradient)" />

  <!-- Detalhes dos pesos -->
  <!-- Linhas no peso esquerdo -->
  <line x1="40" y1="85" x2="55" y2="85" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  <line x1="40" y1="100" x2="55" y2="100" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  <line x1="40" y1="115" x2="55" y2="115" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

  <!-- Linhas no peso direito -->
  <line x1="145" y1="85" x2="160" y2="85" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  <line x1="145" y1="100" x2="160" y2="100" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
  <line x1="145" y1="115" x2="160" y2="115" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

  <!-- Sombra/profundidade -->
  <ellipse cx="100" cy="165" rx="45" ry="8" fill="#000000" opacity="0.1" />

  <!-- Brilho superior -->
  <ellipse cx="100" cy="45" rx="40" ry="15" fill="#ffffff" opacity="0.15" />
</svg>
