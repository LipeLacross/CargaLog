version: '3.8'

services:
  # Banco local opcional (habilite com --profile local-db)
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: cargalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-cargalog}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cargalog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cargalog-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Se DATABASE_URL estiver no .env (Supabase), ela sera usada.
      # Fallback aponta para banco local quando profile local-db estiver ativo.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/cargalog}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/cargalog}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_strong_secret_with_32_plus_chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - cargalog-network
    command: npm run start:dev

volumes:
  postgres_data:
    driver: local

networks:
  cargalog-network:
    driver: bridge

